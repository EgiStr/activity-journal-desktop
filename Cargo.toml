[package]
name = "activity-journal-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Tray, status and settings for Activity Journal, over its engine as it is."
publish = false

[dependencies]
egui = { version = "0.37", features = ["default_fonts"] }
egui-winit = "0.37"
egui-wgpu = { version = "0.37", features = ["winit"] }
winit = "0.30.13"
pollster = "0.4"
tray-icon = "0.26"
toml_edit = "0.25"
serde_json = "1"
chrono-tz = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
notify-rust = "4.19"
png = "0.18"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
egui_plot = "0.38"

[profile.release]
lto = "thin"
strip = true
